<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#0B0F19" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
  
  <!-- Outer Lotus Petals -->
  <path d="M50 20 C42 32 32 46 32 58 C32 68 40 74 50 74 C60 74 68 68 68 58 C68 46 58 32 50 20 Z" fill="url(#goldGrad)" opacity="0.25"/>
  <path d="M50 24 C44 35 36 48 36 58 C36 66 42 71 50 71 C58 71 64 66 64 58 C64 48 56 35 50 24 Z" fill="url(#lotusPink)" opacity="0.85"/>
  <!-- Side Petals -->
  <path d="M50 36 C38 42 22 52 24 64 C25 72 34 74 42 71 C38 65 38 52 50 36 Z" fill="url(#goldGrad)" opacity="0.7"/>
  <path d="M50 36 C62 42 78 52 76 64 C75 72 66 74 58 71 C62 65 62 52 50 36 Z" fill="url(#goldGrad)" opacity="0.7"/>
  <!-- Inner Flame / Stupa Spire -->
  <path d="M50 16 C48 24 46 32 48 40 C49 44 51 44 52 40 C54 32 52 24 50 16 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Central Lotus Core -->
  <circle cx="50" cy="62" r="5" fill="url(#goldGrad)" />
  <circle cx="50" cy="62" r="2.5" fill="#FFFBEB" />
</svg>
